name: Dashboard
options:
  bundleIdPrefix: com.duckets
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Dashboard:
    type: application
    platform: iOS
    sources:
      - Dashboard
    dependencies:
      - target: DashboardWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckets.dashboard
        PRODUCT_NAME: Dashboard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.5.0"
    info:
      path: Dashboard/Info.plist
      properties:
        CFBundleDisplayName: Dashboard
        # XcodeGen writes a literal "1.0" here by default — pin it so
        # the built app actually reports the MARKETING_VERSION.
        CFBundleShortVersionString: "1.5.0"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The app talks plain HTTP to the owner's own bridge on his
        # tailnet/LAN (same choice as the Android app's cleartext config).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  DashboardWidget:
    type: app-extension
    platform: iOS
    sources:
      - DashboardWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckets.dashboard.widget
        PRODUCT_NAME: DashboardWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.5.0"
    info:
      path: DashboardWidget/Info.plist
      properties:
        CFBundleDisplayName: Dashboard
        CFBundleShortVersionString: "1.5.0"
        # The widget fetches the bridge itself (no App Group / shared
        # defaults with the app), so it needs the same cleartext
        # exception for the owner's own tailnet/LAN bridge.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
